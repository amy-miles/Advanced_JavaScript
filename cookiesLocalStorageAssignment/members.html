<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDV321 Advanced JavaScript</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: burlywood;
        }

        #container {
            width: 70%;
            margin-left: auto;
            margin-right: auto;
            padding-left: 15px;
            padding-right: 15px;
            background-color: chocolate;
        }

        header {
            text-align: center;
        }

        nav {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        main {
            display: flex;
        }

        main section {
            width: 50%;
            border: thin solid black;
        }

        section h2,
        section h3 {
            text-align: center;
        }

        footer p {
            text-align: center;
        }

        .pageHeader {
            color: blue;
        }
    </style>
    <script src="cookie-utils.js"></script>
    <script>
        // Check for authorized cookie
        let validUser = getCookie("authorizedUser");

        if (!validUser) {
            // Redirect unauthorized users
            location.href = "index.html";
            alert("please sign in");
        } else {
            console.log("Authorized user: " + validUser);

        }

        // Set the current year in the footer
        function currentYear() {
            const year = new Date().getFullYear();
            document.getElementById("currentYear").textContent = year;
        }

        // Increment hit counter
        function incrementHitCount() {
            let memberHitCount = getCookie("memberHitCounter");
            if (memberHitCount) {
                memberHitCount = parseInt(memberHitCount) + 1;
            } else {
                memberHitCount = 1;
            }
            addCookie("memberHitCounter", memberHitCount, 3650); // 10-year cookie
            document.getElementById("memberHitCount").textContent = memberHitCount;
        }

        function displayRegistrations() {
            // Retrieve the eventRegistration object from localStorage
            const registrations = JSON.parse(localStorage.getItem("eventRegistrations")) || [];

            // Select the container for displaying registrations
            const registrationsContainer = document.getElementById("currentRegistrations");

            // Clear any existing content
            registrationsContainer.innerHTML = "<h3>Current Registrations</h3>";

            // Handle case when there are no registrations
            if (registrations.length === 0) {
                const noRegistrationsMessage = document.createElement("p");
                noRegistrationsMessage.textContent = "No registrations found.";
                registrationsContainer.appendChild(noRegistrationsMessage);
                return;
            }

            // Create an ordered list to display the registrations
            const registrationList = document.createElement("ol");

            // Loop through the registrations and create list items
            registrations.forEach((registration, index) => {
                const listItem = document.createElement("li");
                listItem.textContent = `Guest ${index + 1}: ${registration.name}, ${registration.email}, ${registration.phone} (Registered on: ${registration.registrationDate})`;
                registrationList.appendChild(listItem);
            });

            // Append the list to the container
            registrationsContainer.appendChild(registrationList);
        }

    </script>
</head>

<body onload="incrementHitCount(), currentYear(), displayRegistrations()">
    <div id="container">

        <header>
            <h1>Science Fiction Book Club</h1>
            <h2>"Predicting the future using or describing the future?"</h2>
            <h2 class="pageHeader">Welcome Federation Members!</h2>
        </header>

        <nav>
            <div>
                <a href="index.html"><button>Home Page</button></a>
                <a href="members.html"><button>Members Page</button></a>
            </div>
        </nav>

        <main>
            <section class="leftColumn">
                <h3>Member Information</h3>
                <p>
                    <button onclick="console.log(document.cookie)">Display Cookie</button>
                    <button onclick="deleteCookie(deleteCookie('authorizedUser'))">Delete Authorization Cookie</button>
                </p>
            </section>
            <section class="rightColumn">
                <h3>Upcoming Events</h3>
                <div>
                    <h3>"Did Star Trek predict AI?"</h3>
                </div>
                <div id="currentRegistrations">
                    <h3>Current Registrations</h3>

                </div>
            </section>
        </main>

        <footer>
            <p>Copyright &copy;<span id="currentYear"></span> All rights reserved.</p>
            <p>Current Activity: <span id="memberHitCount"></span></p>
        </footer>

    </div>
</body>

</html>
